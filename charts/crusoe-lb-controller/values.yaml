crusoe:
  secrets:
    crusoeApiKeys:
      # The Crusoe LB Controller requires access to the Crusoe API in order to manage load balancer resources.
      # It is expected that the secret will contain two keys at accessKeyPath and secretKeyPath containing
      # the base64 encoded access key and secret key respectively.
      secretName: "crusoe-secrets"
      accessKeyPath: "CRUSOE_ACCESS_KEY"
      secretKeyPath: "CRUSOE_SECRET_KEY"
      clusterIdPath: "CRUSOE_CLUSTER_ID"
      projectIdPath: "CRUSOE_PROJECT_ID"
      # IAM service account (OAuth2 client credentials) keys. All four are optional:
      # the controller authenticates with the service account when the secret carries
      # them, falling back to the access/secret key pair above on an auth rejection.
      # tokenUrl/audience default to production inside the controller and must both
      # be present in the secret for non-production environments.
      clientIdPath: "CRUSOE_CLIENT_ID"
      clientSecretPath: "CRUSOE_CLIENT_SECRET"
      tokenUrlPath: "CRUSOE_TOKEN_URL"
      audiencePath: "CRUSOE_AUDIENCE"

controller:
  namespace: crusoe-system
  image:
    repository: ghcr.io/crusoecloud/crusoe-load-balancer-controller
    tag: "latest"
    pullPolicy: Always
    imagePullSecrets: []

  env:
    CRUSOE_API_ENDPOINT: "https://api.crusoecloud.com/v1alpha5"
    # subnet_id is optional if using a cmk cluster but required for self-managed clusters
    CRUSOE_SUBNET_ID: ""

  # Additional environment variables for proxy configuration and other optional settings.
  # These are injected into the controller container after the core env variables.
  #
  # Example:
  #   extraEnv:
  #     HTTP_PROXY: "http://proxy.example.com:8080"
  #     HTTPS_PROXY: "https://proxy.example.com:8080"
  #     NO_PROXY: "localhost,127.0.0.1,.svc.cluster.local"
  extraEnv: {}